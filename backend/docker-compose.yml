services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: dnd_manager
      POSTGRES_USER: dnd_user
      POSTGRES_PASSWORD: dnd_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7
    ports:
      - "6379:6379"
      
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://dnd_user:dnd_password@db:5432/dnd_manager
      SECRET_KEY: 2dfdc2d2215b61148eb92bcee3a3aaee820b29345ff6ecc0ee618d2512173cfa
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      CORS_ORIGINS: http://localhost:5173
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - exports_data:/app/exports
    depends_on:
      - db
  
  worker:
    build: .
    command: uv run celery -A celery_app:celery_app worker --loglevel=info
    environment:
      SECRET_KEY: 2dfdc2d2215b61148eb92bcee3a3aaee820b29345ff6ecc0ee618d2512173cfa
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgresql+psycopg://dnd_user:dnd_password@db:5432/dnd_manager
    volumes:
      - exports_data:/app/exports
    depends_on:
      - redis

volumes:
  postgres_data:
  exports_data: